<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ionpower-node chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
    --bg:    #0e1116;
    --panel: #161b22;
    --line:  #30363d;
    --fg:    #c9d1d9;
    --muted: #6e7681;
    --you:   #58a6ff;
    --them:  #7ee787;
    --sys:   #d29922;
    --err:   #f85149;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    display: flex;
    flex-direction: column;
}
header {
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    padding: 8px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
}
header h1 {
    font-size: 14px;
    font-weight: 600;
    margin: 0;
    color: var(--fg);
}
header .banner {
    font-size: 12px;
    color: var(--muted);
    flex-grow: 1;
}
header .banner b { color: var(--you); }
header .status {
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid var(--line);
}
header .status.connected { color: var(--them); border-color: var(--them); }
header .status.disconnected { color: var(--err); border-color: var(--err); }
main {
    flex-grow: 1;
    display: grid;
    grid-template-columns: 1fr 200px;
    overflow: hidden;
}
#log {
    overflow-y: auto;
    padding: 14px;
    margin: 0;
    list-style: none;
}
#log li { margin-bottom: 4px; }
#log .nick    { color: var(--them); font-weight: 600; }
#log .youNick { color: var(--you);  font-weight: 600; }
#log .ts      { color: var(--muted); font-size: 11px; margin-right: 6px; }
#log .sys     { color: var(--sys); font-style: italic; }
#log .err     { color: var(--err); }
aside {
    background: var(--panel);
    border-left: 1px solid var(--line);
    padding: 14px;
    overflow-y: auto;
}
aside h2 {
    font-size: 12px;
    color: var(--muted);
    margin: 0 0 8px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
}
aside ul { list-style: none; padding: 0; margin: 0; }
aside li { padding: 2px 0; }
aside li.me { color: var(--you); font-weight: 600; }
form {
    display: flex;
    border-top: 1px solid var(--line);
    background: var(--panel);
    padding: 8px;
    gap: 8px;
    flex-shrink: 0;
}
input[type=text] {
    flex-grow: 1;
    background: var(--bg);
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 12px;
    font: inherit;
}
input[type=text]:focus { outline: none; border-color: var(--you); }
button {
    background: var(--you);
    color: var(--bg);
    border: none;
    border-radius: 6px;
    padding: 8px 16px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
}
button:hover { filter: brightness(1.1); }
@media (max-width: 600px) {
    main { grid-template-columns: 1fr; }
    aside { display: none; }
}
</style>
</head>
<body>
<header>
    <h1>ionpower-node chat</h1>
    <div class="banner" id="banner">connecting…</div>
    <span class="status" id="status">offline</span>
</header>
<main>
    <ul id="log"></ul>
    <aside>
        <h2>online</h2>
        <ul id="roster"></ul>
    </aside>
</main>
<form id="form" autocomplete="off">
    <input type="text" id="input" placeholder="type a message; /nick yourname to rename" autofocus maxlength="1024">
    <button type="submit">send</button>
</form>
<script>
(function () {
    var log     = document.getElementById("log");
    var roster  = document.getElementById("roster");
    var input   = document.getElementById("input");
    var form    = document.getElementById("form");
    var status  = document.getElementById("status");
    var banner  = document.getElementById("banner");

    var myNick = null;

    var wsUrl = "ws://" + location.hostname + ":" + (parseInt(location.port || "80", 10) + 1) + "/";
    var ws    = new WebSocket(wsUrl);

    function pad(n) { return n < 10 ? "0" + n : "" + n; }
    function fmtTs(ms) {
        var d = new Date(ms || Date.now());
        return pad(d.getHours()) + ":" + pad(d.getMinutes());
    }
    function append(el) {
        log.appendChild(el);
        log.scrollTop = log.scrollHeight;
    }
    function addSys(text) {
        var li = document.createElement("li");
        li.className = "sys";
        li.textContent = "* " + text;
        append(li);
    }
    function addMsg(nick, text, ts, isYou) {
        var li = document.createElement("li");
        var s1 = document.createElement("span"); s1.className = "ts";    s1.textContent = "[" + fmtTs(ts) + "]";
        var s2 = document.createElement("span"); s2.className = isYou ? "youNick" : "nick"; s2.textContent = " <" + nick + "> ";
        var s3 = document.createElement("span"); s3.textContent = text;
        li.appendChild(s1); li.appendChild(s2); li.appendChild(s3);
        append(li);
    }
    function setRoster(nicks) {
        roster.innerHTML = "";
        for (var i = 0; i < nicks.length; i++) {
            var li = document.createElement("li");
            if (nicks[i] === myNick) li.className = "me";
            li.textContent = nicks[i];
            roster.appendChild(li);
        }
    }

    ws.onopen = function () {
        status.textContent = "online";
        status.className = "status connected";
        addSys("connected");
    };
    ws.onclose = function () {
        status.textContent = "offline";
        status.className = "status disconnected";
        addSys("disconnected");
    };
    ws.onerror = function () {
        status.textContent = "error";
        status.className = "status disconnected";
    };
    ws.onmessage = function (ev) {
        var msg;
        try { msg = JSON.parse(ev.data); } catch (e) { return; }
        switch (msg.type) {
            case "banner":
                banner.innerHTML = "served by <b>" + msg.data.runtime + "</b> on " +
                    msg.data.host + " (" + msg.data.arch + ", " + msg.data.cpus + ")";
                break;
            case "you":
                myNick = msg.nick;
                addSys("you are " + myNick + " — type /nick yourname to change");
                break;
            case "msg":
                addMsg(msg.nick, msg.text, msg.ts, msg.nick === myNick);
                break;
            case "join":
                addSys(msg.nick + " joined");
                setRoster(msg.roster);
                break;
            case "leave":
                addSys(msg.nick + " left");
                setRoster(msg.roster);
                break;
            case "nick":
                if (msg.oldNick === myNick) myNick = msg.newNick;
                addSys(msg.oldNick + " is now " + msg.newNick);
                setRoster(msg.roster);
                break;
            case "roster":
                setRoster(msg.nicks);
                break;
        }
    };

    form.addEventListener("submit", function (e) {
        e.preventDefault();
        var text = input.value.trim();
        if (!text) return;
        if (text.indexOf("/nick ") === 0) {
            ws.send(JSON.stringify({ type: "nick", nick: text.slice(6) }));
        } else {
            ws.send(JSON.stringify({ type: "msg", text: text }));
        }
        input.value = "";
    });
})();
</script>
</body>
</html>
